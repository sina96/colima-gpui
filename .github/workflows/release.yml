name: Release

# Publishes a GitHub Release when the maintainer pushes a version tag (v0.1.0, v0.2.0, ...).
# Nothing here runs on branches or pull requests. CONTRIBUTING.md ("Releasing") has the steps.
#
# Only the owner releases:
#   - pushing a tag needs write access, and a tag ruleset limits v* tags to the owner;
#   - the check job stops unless the owner pushed the tag;
#   - the publish job runs in the "release" environment, which waits for the owner's approval.
on:
  push:
    tags: ["v*"]

# One release at a time per tag; never cancel a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to full commit SHAs, so a moved tag can't change them.
jobs:
  # The tag must match Cargo.toml, and CHANGELOG.md must have notes for the version.
  check:
    name: Check version and notes
    # Only the repository owner's tags are released.
    if: github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version (expected v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes exist
        run: packaging/release-notes.sh "${{ steps.version.outputs.version }}"

  # One native build per architecture: the app (.zip, used by in-app updates) and the
  # installer (.dmg). The names follow the release asset contract in the plan.
  build:
    name: Build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Build the app and the disk image
        env:
          COLIMA_GPUI_UPDATE_REPO: ${{ github.repository }}
        run: just dmg

      - name: Check the architecture
        run: |
          binary="dist/Colima GPUI.app/Contents/MacOS/colima-gpui"
          lipo -archs "$binary"
          [[ "$(lipo -archs "$binary")" == "${{ matrix.arch }}" ]]

      - name: Name the release files
        run: |
          mkdir release
          base="Colima-GPUI-$VERSION-macos-${{ matrix.arch }}"
          # ditto keeps the bundle's symlinks, permissions and signature.
          ditto -c -k --keepParent "dist/Colima GPUI.app" "release/$base.zip"
          cp "dist/Colima GPUI.dmg" "release/$base.dmg"
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libglib2.0-dev libssl-dev libzstd-dev
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build AppImage
        env:
          COLIMA_GPUI_UPDATE_REPO: ${{ github.repository }}
        run: just appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # Collects all platform builds, adds SHA256SUMS and publishes the release with the changelog notes.
  publish:
    name: Publish the release
    needs: [check, build, build-linux]
    runs-on: macos-26
    timeout-minutes: 15
    # Waits for approval by the environment's required reviewers (the owner) before publishing.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          shasum -a 256 Colima-GPUI-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          {
            packaging/release-notes.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo "Download the \`.dmg\` for your Mac: **arm64** for Apple silicon (M1 and later), **x86_64** for Intel. Open it and drag Colima GPUI to Applications."
            echo
            echo "The app isn't notarized by Apple yet. The first time you open it, macOS blocks it: open **System Settings → Privacy & Security** and click **Open Anyway**. See the [README](https://github.com/${{ github.repository }}#install) for details."
            echo
            echo "Colima GPUI needs [Colima](https://github.com/abiosoft/colima#installation) and the Docker CLI: \`brew install colima docker\`."
            echo
            echo "On Linux, download the \`.AppImage\` for **x86_64** or **aarch64**, run \`chmod +x <file>.AppImage\`, then \`./<file>.AppImage\`. Install Colima and the Docker CLI separately."
            echo
            echo "AppImages normally use FUSE. If FUSE is unavailable, run \`APPIMAGE_EXTRACT_AND_RUN=1 ./<file>.AppImage\`. Vulkan, Wayland/X11 and fontconfig libraries come from your system."
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Colima GPUI $VERSION" \
            --notes-file notes.md \
            --verify-tag

  # After publishing: reads the release back from GitHub as an installed app would, and runs
  # the updater's checks on it, short of installing. A failure here means installed apps
  # couldn't update to this release.
  verify:
    name: Verify the published release
    needs: [check, publish]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download the release as the updater does
        run: |
          mkdir verify
          gh api "repos/${{ github.repository }}/releases/latest" > verify/latest.json
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern "Colima-GPUI-$VERSION-macos-*.zip" \
            --pattern "Colima-GPUI-$VERSION-linux-*.AppImage" --pattern SHA256SUMS --dir verify
          ls -l verify

      - name: The updater reads the release
        env:
          COLIMA_GPUI_RELEASE_JSON: verify/latest.json
          COLIMA_GPUI_RELEASE_SUMS: verify/SHA256SUMS
          COLIMA_GPUI_RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: cargo test --test published_release -- --ignored

      - name: Checksums, signature, identity and version of each app
        working-directory: verify
        run: |
          shasum -a 256 -c SHA256SUMS --ignore-missing
          for arch in x86_64 aarch64; do
            image="Colima-GPUI-$VERSION-linux-$arch.AppImage"
            test -s "$image"
            grep -q "  $image\$" SHA256SUMS || { echo "Missing checksum: $image" >&2; exit 1; }
          done
          for arch in arm64 x86_64; do
            zip="Colima-GPUI-$VERSION-macos-$arch.zip"
            grep -q "  $zip\$" SHA256SUMS || { echo "SHA256SUMS has no line for $zip" >&2; exit 1; }
            mkdir "$arch" && ditto -x -k "$zip" "$arch"
            app="$arch/Colima GPUI.app"
            codesign --verify --strict "$app"
            id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            [[ "$id" == dev.colima-gpui.Colima ]] || { echo "$zip: identifier $id" >&2; exit 1; }
            [[ "$version" == "$VERSION" ]] || { echo "$zip: version $version" >&2; exit 1; }
            [[ "$(lipo -archs "$app/Contents/MacOS/colima-gpui")" == "$arch" ]] || { echo "$zip: wrong architecture" >&2; exit 1; }
            echo "$zip: OK ($id $version $arch)"
          done
