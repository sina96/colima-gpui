name: Release

# Publishes a GitHub Release when the maintainer pushes a version tag (v0.1.0, v0.2.0, ...).
# Nothing here runs on branches or pull requests. CONTRIBUTING.md ("Releasing") has the steps.
#
# Only the owner releases:
#   - pushing a tag needs write access, and a tag ruleset limits v* tags to the owner;
#   - the check job stops unless the owner pushed the tag;
#   - the publish job runs in the "release" environment, which waits for the owner's approval.
on:
  push:
    tags: ["v*"]

# One release at a time per tag; never cancel a release half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to full commit SHAs, so a moved tag can't change them.
jobs:
  # The tag must match Cargo.toml, and CHANGELOG.md must have notes for the version.
  check:
    name: Check version and notes
    # Only the repository owner's tags are released.
    if: github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version (expected v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes exist
        run: packaging/release-notes.sh "${{ steps.version.outputs.version }}"

  # One native build per architecture: the app (.zip, used by in-app updates) and the
  # installer (.dmg). The names follow the release asset contract in the plan.
  build:
    name: Build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Build the app and the disk image
        env:
          COLIMA_GPUI_UPDATE_REPO: ${{ github.repository }}
        run: just dmg

      - name: Check the architecture
        run: |
          binary="dist/Colima GPUI.app/Contents/MacOS/colima-gpui"
          lipo -archs "$binary"
          [[ "$(lipo -archs "$binary")" == "${{ matrix.arch }}" ]]

      - name: Name the release files
        run: |
          mkdir release
          base="Colima-GPUI-$VERSION-macos-${{ matrix.arch }}"
          # ditto keeps the bundle's symlinks, permissions and signature.
          ditto -c -k --keepParent "dist/Colima GPUI.app" "release/$base.zip"
          cp "dist/Colima GPUI.dmg" "release/$base.dmg"
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Collects both builds, adds SHA256SUMS and publishes the release with the changelog notes.
  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: macos-26
    timeout-minutes: 15
    # Waits for approval by the environment's required reviewers (the owner) before publishing.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          shasum -a 256 Colima-GPUI-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          {
            packaging/release-notes.sh "$VERSION"
            echo
            echo "## Install"
            echo
            echo "Download the \`.dmg\` for your Mac: **arm64** for Apple silicon (M1 and later), **x86_64** for Intel. Open it and drag Colima GPUI to Applications."
            echo
            echo "The app isn't notarized by Apple yet. The first time you open it, macOS blocks it: open **System Settings → Privacy & Security** and click **Open Anyway**. See the [README](https://github.com/${{ github.repository }}#install) for details."
            echo
            echo "Colima GPUI needs [Colima](https://github.com/abiosoft/colima#installation) and the Docker CLI: \`brew install colima docker\`."
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Colima GPUI $VERSION" \
            --notes-file notes.md \
            --verify-tag
