name: Question
description: Ask how to do something with Colima GPUI.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Read the README and search the issues first; the answer may already be there.
        If something doesn't work as described, use the bug report form instead.
  - type: textarea
    id: tried
    attributes:
      label: What you tried
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Colima GPUI version
      placeholder: "0.1.0"
    validations:
      required: true
